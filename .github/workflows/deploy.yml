# Builds the site and publishes it on GitHub Pages after every push to main.
# Supabase settings come from repository variables (Settings → Secrets and variables → Actions → Variables):
#   VITE_SUPABASE_URL       — Project URL from Supabase
#   VITE_SUPABASE_ANON_KEY  — the public anon (publishable) key. NEVER the service_role / secret key.
# Without them the site is built in offline mode (no accounts).
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Checks (answers, database rules)
        run: |
          npx tsx scripts/audit.ts
          npx tsx scripts/check-db.ts
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
